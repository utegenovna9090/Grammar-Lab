<head>

<title>Grammar Lab — Passive Voice</title>
<style>

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg) linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 32px;background-attachment:fixed;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.2px}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--amb);color:var(--ink);font-style:normal;font-size:15px;font-weight:900}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{padding:7px 12px;border-radius:8px;color:#c9d4ee;font-size:15px}
nav button:hover{background:#ffffff1a}
nav button.on{background:#fff;color:var(--ink);font-weight:700}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:6px 8px;border-radius:8px;border:1px solid #ffffff55;background:#ffffff14;color:#fff;font:inherit;font-size:14px}
select option{color:#000}
.chip{padding:5px 11px;border-radius:999px;background:#ffffff1f;font-size:14px;font-weight:600;white-space:nowrap}
.chip.pts{background:var(--amb);color:var(--ink)}
#burger{display:none;margin-left:auto;font-size:24px;color:#fff}
main{max-width:1060px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin-bottom:10px}
h2{font-size:26px;margin-bottom:12px}
h3{font-size:19px;margin:16px 0 8px}
p{margin:8px 0;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.w{display:inline-block;padding:2px 10px;margin:2px;border-radius:8px;font-weight:700;color:#fff}
.w.s{background:var(--sub)}.w.b{background:var(--be)}.w.v{background:var(--v3)}.w.a{background:var(--ag)}.w.n{background:#8892aa}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;margin-bottom:10px}
.demo{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px;font-size:20px;min-height:230px}
.demo .row{margin:10px 0}
.demo small{display:block;color:#9fb0d6;font-size:13px;margin-top:14px}
.arrow{font-size:28px;color:var(--amb);animation:bob 1.6s infinite}

.stat{text-align:center}
.stat b{font-size:30px;display:block}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--v3));border-radius:99px;transition:width .6s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:8px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:#eaf0fb}
tr[data-a]{cursor:pointer}
tr[data-a]:hover td{background:#f3f7ff}
tr.sel td{background:#fff4d6}
tr .tick{color:var(--ok);font-weight:800}
.tw{overflow-x:auto}
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fc button{padding:12px 8px;border-radius:10px;background:#fff;border:2px dashed var(--blue);font-weight:700;transition:.2s}
.fc button.f{background:var(--blue);color:#fff;border-style:solid}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:#e3f7ef}
.opt.no{border-color:var(--bad);background:#fde8e8;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{padding:12px 14px;border-radius:10px;margin:10px 0;font-weight:600}
.fb.ok{background:#e3f7ef;color:#0b6b52}.fb.no{background:#fde8e8;color:#9b1c22}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);font:inherit}
.qc{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.qc em{font-size:34px;font-style:normal}
.badge{text-align:center;padding:16px 10px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.badge.lock{filter:grayscale(1);opacity:.5}
.badge em{font-size:38px;font-style:normal;display:block}
.big{font-size:56px;font-weight:800}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:50;transition:.35s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 24px}
.hint{color:var(--mut);font-size:14px}
.ov{position:fixed;inset:0;background:#14213dd9;z-index:60;display:none;place-items:center;padding:16px;overflow:auto}
.mb{background:#fff;border-radius:var(--r);padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px #0006}
.mb label{display:block;margin-top:12px;font-weight:700}
.pc{padding:6px 14px;margin:4px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:17px}
.pc:hover{background:#eef3ff}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:6px;background:#f8fbff;margin-bottom:10px}
textarea{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);font:12px/1.4 monospace}
@media(max-width:820px){
 #burger{display:block}
 nav{display:none;width:100%;order:5;flex-direction:column}
 nav.open{display:flex}
 .hero{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 if(Q.lock){var e=g.t==="gap"?q[3]:q[4];h+='<div class="fb '+(Q.good?"ok":"no")+'">'+(Q.good?"✓ Дұрыс! ":"✗ Қате. Дұрыс жауап: "+(g.t==="gap"?q[2][0]:q[3])+". ")+esc(e)+'</div><button class="btn" data-a="next">'+(Q.i+1<Q.q.length?"Келесі сұрақ":"Нәтижені көру")+'</button>'}
 return h+'</div><button class="btn alt sm" data-a="quit">Шығу</button>'}

function render(){var a=$("#app");a.innerHTML=V[UI.v]();hud();
 var vb=$("#vb");if(vb)VB.forEach(function(v){var b=document.createElement("button");b.textContent=v[0];b.dataset.s="0";b.onclick=function(){var s=(+b.dataset.s+1)%3;b.dataset.s=s;b.textContent=v[s];b.classList.toggle("f",s>0)};vb.appendChild(b)})}
function go(v){UI.v=v;if(v!=="practice")UI.Q=null;$("#nav").classList.remove("open");render();window.scrollTo(0,0)}
function setQ(){var Q=UI.Q,q=Q.q[Q.i];Q.lock=false;Q.val="";Q.pick=-1;Q.opts=QZ[Q.id].t==="mc"?shuf(q[2]):q[2]}
function answer(good,qid){var Q=UI.Q;Q.lock=true;Q.good=good;if(good){Q.sc++;if(!S.ans[qid]){S.ans[qid]=1;award(10)}else save()}hud();render()}

/* ---------- EVENTS ---------- */
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,p=el.dataset.p,Q=UI.Q;
 if(a==="go")go(p);
 else if(a==="les"){UI.les=+p;render()}
 else if(a==="read"){if(S.read.indexOf(+p)<0){S.read.push(+p);award(5);toast("+5 ұпай")}render()}
 else if(a==="row"){UI.row=+p;if(S.rows.indexOf(+p)<0){S.rows.push(+p);award(2)}render()}
 else if(a==="trs"){UI.tr=+p;initTr();render()}
 else if(a==="pk"){if(UI.res!=="ok"){UI.sel.push(p);UI.res="";render()}}
 else if(a==="unpk"){if(UI.res!=="ok"){UI.sel.splice(+p,1);UI.res="";render()}}
 else if(a==="clr"){UI.sel=[];UI.res="";render()}
 else if(a==="hint"){UI.hint=!UI.hint;render()}
 else if(a==="cx"){var tt=TR[UI.tr],ex=tt.p.map(function(w){return w[0]}).join("|");if(UI.sel.join("|")===ex){UI.res="ok";if(S.tr.indexOf(UI.tr)<0){S.tr.push(UI.tr);award(5);toast("+5 ұпай")}}else UI.res="no";render()}
 else if(a==="start"){if(S.read.length<3){toast("Алдымен теорияны толық оқы");return go("theory")}var qs=shuf(items(p));UI.Q={id:p,q:qs,i:0,sc:0};setQ();render();window.scrollTo(0,0)}
 else if(a==="pick"&&Q&&!Q.lock){Q.pick=+p;var q=Q.q[Q.i];answer(Q.opts[+p]===q[3],Q.id+q[1])}
 else if(a==="chk"&&Q&&!Q.lock){Q.val=$("#gp").value;if(!norm(Q.val))return toast("Алдымен жауап жазыңыз");var q2=Q.q[Q.i];answer(q2[2].some(function(x){return norm(x)===norm(Q.val)}),Q.id+q2[1])}
 else if(a==="next"){Q.i++;if(Q.i>=Q.q.length){var pc=Math.round(Q.sc/Q.q.length*100);if(S.done[Q.id]===undefined)award(20);if(S.done[Q.id]===undefined||pc>S.done[Q.id])S.done[Q.id]=pc;check()}else setQ();render()}
 else if(a==="quit"){UI.Q=null;render()}
 else if(a==="logout"){TEACHER=false;UI.v="home";UI.Q=null;S=def();hud();render();showReg()}
 else if(a==="tl"){if(TEACHER)go("teacher");else showTeacher()}
 else if(a==="reg"){doReg()}
 else if(a==="tpass"){if(hs($("#tp").value)===TP){TEACHER=true;TPW=$("#tp").value;closeM();go("teacher");pull()}else{$("#te").textContent="Құпиясөз қате"}}
 else if(a==="mclose"){closeM();if(!S.id&&!TEACHER)showReg()}
 else if(a==="pull"){pull()}
 else if(a==="tout"){TEACHER=false;go("home")}
 else if(a==="csv"&&TEACHER){csv()}
 else if(a==="imp"&&TEACHER){imp()}
 else if(a==="tdel"&&TEACHER){if(confirm("Бұл оқушының нәтижесі өшіріледі. Жалғастыру керек пе?")){delete R[p];persist();render()}}
 else if(a==="code"){$("#cd").select();try{document.execCommand("copy");toast("Код көшірілді")}catch(x){toast("Кодты қолмен көшіріңіз")}}
});
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var i=e.target.id,m={gp:"chk",rn:"reg",rg:"reg",tp:"tpass"};if(m[i]){var b=document.querySelector('[data-a="'+m[i]+'"]');if(b)b.click()}});
$("#burger").onclick=function(){$("#nav").classList.toggle("open")};
function net(){$("#net").textContent=navigator.onLine?"· Желіде":"· Офлайн режим"}
window.addEventListener("online",net);window.addEventListener("offline",net);net();
initTr();
if(!S.id)showReg();
render();
</script>
